name: Docs
on:
    push:
        branches: [main]
        # `docs/internal/**` is negated: those pages are the repo's own rules and
        # are excluded from the site, so touching them must not redeploy Pages.
        paths:
            [
                "docs/**",
                "!docs/internal/**",
                "mkdocs.yml",
                "scripts/gen-llms.mjs",
                ".github/workflows/docs.yml",
            ]
    workflow_dispatch:
# Every job declares what it needs (#532). The build job runs third-party code
# (the pip install, mkdocs and its plugins) with read access only; the Pages
# write and the OIDC identity reach the deploy job alone, which runs one pinned
# action and nothing installed.
permissions: {}
concurrency: { group: pages, cancel-in-progress: false }
jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with: { python-version: "3.12" }
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with: { node-version: "22" }
            # docs/requirements.txt pins every package with its hashes, so the
            # install fails instead of taking bytes nobody reviewed.
            - run: pip install --require-hashes -r docs/requirements.txt
            - run: node scripts/gen-llms.mjs
            - run: mkdocs build --strict
            - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
              with: { path: site }
    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
        steps:
            - id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
