name: Release to npm

on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

# Every job declares exactly what it needs. The split is the point (#451): the
# only job that can publish runs a pinned npm CLI and a tarball that an
# unprivileged job built and smoked. Nothing resolved from the registry at
# release time — `npm ci`, the test suite, the build, the floating smoke
# installs — ever runs next to `id-token: write` or `contents: write`.
permissions: {}

# One release at a time, of any tag (#472). A tag push and a dispatch on the
# same tag would otherwise race to publish and to cut the Release, and two
# different tags would read the same registry `latest` and both claim it — the
# older one landing last. They queue instead; a release half-way through its
# 30-min read-back is never cancelled, because its publish may already have
# happened. GitHub keeps one pending run per group: a third run queued behind a
# pending one cancels that pending run, which then has to be dispatched again.
concurrency:
    group: release-npm
    cancel-in-progress: false

jobs:
    build:
        name: Verify, build and pack
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            name: ${{ steps.pack.outputs.name }}
            tag: ${{ steps.version.outputs.tag }}
            version: ${{ steps.version.outputs.version }}
            prerelease: ${{ steps.version.outputs.prerelease }}
            dist_tag: ${{ steps.version.outputs.dist_tag }}
            artifact: npm-tarball-${{ github.run_attempt }}
            tarball: ${{ steps.pack.outputs.tarball }}
            sha256: ${{ steps.pack.outputs.sha256 }}
            release_script_sha256: ${{ steps.pack.outputs.release_script_sha256 }}
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: package-lock.json

            # The guard picks the dist-tag against the registry's current
            # `latest`, so `latest` only ever moves forward (#472). Only an
            # explicit E404 counts as a package with no `latest`; an empty answer
            # fails, and any other failure is retried and then fails the run,
            # because guessing "no latest" would send a backport there.
            - name: Read the registry's current latest dist-tag
              id: registry
              run: |
                  PKG_NAME=$(node -p "require('./package.json').name")
                  LATEST=$(scripts/release-dist-tag.sh current-latest "$PKG_NAME" 2>"$RUNNER_TEMP/current-latest.err") || { cat "$RUNNER_TEMP/current-latest.err"; exit 1; }
                  cat "$RUNNER_TEMP/current-latest.err"
                  echo "current_latest=${LATEST}" >> "$GITHUB_OUTPUT"
                  echo "· ${PKG_NAME} latest on the registry: '${LATEST}'"

            # Publishes from a vX.Y.Z tag only — workflow_dispatch included —
            # that matches package.json and points at the checked-out commit
            # (#452). The tag, the npm version and the Release share one SHA.
            - name: Check the ref is a release tag for this commit
              id: version
              env:
                  CURRENT_LATEST: ${{ steps.registry.outputs.current_latest }}
              run: scripts/check-release-ref.sh

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Type check
              run: npm run typecheck

            - name: Run tests
              run: npm run test:run

            - name: Build
              run: npm run build

            # The artifact is named per attempt: a full re-run uploads its own
            # (a fixed name would collide with the first attempt's), and "Re-run
            # failed jobs" keeps this job's outputs, so the re-run jobs download
            # the artifact of the attempt that built them.
            # The digest travels as a job output, which no later job can
            # rewrite; every job that consumes the artifact checks it first.
            - name: Pack
              id: pack
              run: |
                  TARBALL=$(npm pack --silent)
                  {
                    echo "tarball=${TARBALL}"
                    echo "sha256=$(sha256sum "$TARBALL" | cut -d' ' -f1)"
                    echo "release_script_sha256=$(sha256sum scripts/release-dist-tag.sh | cut -d' ' -f1)"
                    echo "name=$(node -p "require('./package.json').name")"
                  } >> "$GITHUB_OUTPUT"

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: npm-tarball-${{ github.run_attempt }}
                  path: |
                      ${{ steps.pack.outputs.tarball }}
                      scripts/release-dist-tag.sh
                  if-no-files-found: error

    smoke:
        name: Smoke the packed tarball
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: "22"

            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: ${{ needs.build.outputs.artifact }}

            - name: Check the tarball is the one the build job packed
              env:
                  TARBALL: ${{ needs.build.outputs.tarball }}
                  SHA256: ${{ needs.build.outputs.sha256 }}
              run: echo "${SHA256}  ${TARBALL}" | sha256sum --check

            # The tarball is exercised the way every consumer consumes it: through
            # a bundler. Bare Node is not an option since 0.63.0 — each component
            # module imports its own stylesheet, and `.css` is not a format Node
            # can load, so `import("tempest-react-sdk")` dies with
            # ERR_UNKNOWN_FILE_EXTENSION before any assertion runs. esbuild
            # resolves those imports and drops them (`--loader:.css=empty`), which
            # is what Vite, webpack and Rspack do with them as well.
            #
            # Both guards of the older Node-only smoke survive the change, measured:
            # a missing peer fails the bundle step (esbuild exits 1 on `Could not
            # resolve "react-router"`) and a missing export fails the run step.
            # react + react-dom + react-router go in explicitly so the smoke never
            # rides on npm's peer auto-install. The SDK still bundles zod / zustand
            # / dexie / react-hook-form / @tanstack/react-query / lucide-react as
            # direct dependencies (auto-resolved by npm install).
            - name: Smoke-install packed tarball and bundle core symbols
              env:
                  TARBALL: ${{ needs.build.outputs.tarball }}
              run: |
                  mkdir -p /tmp/sdk-smoke && cd /tmp/sdk-smoke
                  npm init -y >/dev/null
                  npm pkg set type=module >/dev/null
                  npm install --silent "$GITHUB_WORKSPACE/$TARBALL" react@^19 react-dom@^19 react-router@^8 esbuild
                  cp "$GITHUB_WORKSPACE/scripts/smoke-imports.mjs" entry.mjs
                  npx esbuild entry.mjs --bundle --format=esm --platform=node --loader:.css=empty --outfile=smoke.mjs --log-level=warning
                  node smoke.mjs

            # The bundled smoke above is the consumer path; this one is the escape
            # hatch the package ships for everything that is not a bundler — a
            # script, a Jest suite with no stylesheet transform, any read of the
            # surface by introspection. It runs the exact same assertions in bare
            # Node, which only gets that far because `--import` registers the
            # loader first. Smoking the published subpath is also what keeps it
            # honest: a loader that stopped resolving stylesheets fails here.
            - name: Smoke the shipped Node CSS loader
              run: |
                  cd /tmp/sdk-smoke
                  node --import tempest-react-sdk/node-css-loader entry.mjs

            # The third consumer path: a Vitest suite, which externalizes the package
            # to Node unless `tempestVitest()` (part of `createViteConfig`) inlines it.
            - name: Smoke a consumer Vitest suite against the tarball
              env:
                  TARBALL: ${{ needs.build.outputs.tarball }}
              run: scripts/smoke-vitest.sh "$TARBALL"

            # The `tempest` bin, run the way `npx tempest` runs it: plain Node, no
            # `--import`. `gen icons` imported a barrel that reaches a `.css` and failed
            # in every installed app until 0.77.0 (#485).
            - name: Smoke the tempest CLI against the tarball
              env:
                  TARBALL: ${{ needs.build.outputs.tarball }}
              run: scripts/smoke-cli.sh "$TARBALL"

    publish:
        name: Publish tempest-react-sdk
        needs: [build, smoke]
        runs-on: ubuntu-latest
        # The hook for a human gate: required reviewers and a v* tag rule are
        # set on this environment in the repo settings, and the npm Trusted
        # Publisher can be bound to it. Unconfigured, it gates nothing.
        environment: npm-release
        permissions:
            id-token: write
        steps:
            - name: Set up Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: "22"
                  registry-url: "https://registry.npmjs.org"

            # Trusted Publishing (OIDC) needs npm >= 11.5.1 and Node 22 ships
            # 10.x, so the CLI is upgraded — to an exact version, because this is
            # the binary that holds the OIDC token. 12.2.0 is the one that
            # published v0.74.0 through v0.76.0 (the floating `latest` tag resolved
            # to it, read off the run logs), and `latest` had moved 10 → 11 → 12 under
            # this job without anyone choosing it. Bump it on purpose.
            - name: Install the pinned npm CLI
              run: npm install -g npm@12.2.0

            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: ${{ needs.build.outputs.artifact }}

            - name: Check the tarball and the dist-tag script are the ones the build job packed
              env:
                  TARBALL: ${{ needs.build.outputs.tarball }}
                  SHA256: ${{ needs.build.outputs.sha256 }}
                  RELEASE_SCRIPT_SHA256: ${{ needs.build.outputs.release_script_sha256 }}
              run: |
                  echo "${SHA256}  ${TARBALL}" | sha256sum --check
                  echo "${RELEASE_SCRIPT_SHA256}  scripts/release-dist-tag.sh" | sha256sum --check

            # No NODE_AUTH_TOKEN: publish authenticates via GitHub OIDC
            # (npm Trusted Publishing). Provenance is generated automatically.
            # Requires a Trusted Publisher configured on npmjs.com pointing at
            # this repo + workflow file (release-npm.yml).
            # It publishes the tarball the build job packed and the smoke job
            # exercised, by path: a directory publish would re-run
            # `prepublishOnly` (typecheck + lint + the whole test suite + build)
            # inside this job, and ship a fresh pack instead of the smoked one.
            # A tarball publish runs no lifecycle script at all.
            # Skipped when the registry already serves this exact version, which
            # is what makes re-running a failed run a real recovery rather than a
            # second publish that aborts on conflict. The read-back below is the
            # step that fails when npm is slow to propagate, and it fails *after*
            # a successful upload — so the run that has to be repeated is one
            # whose publish already happened.
            #
            # The dist-tag is picked again right here (#472), from the registry's
            # `latest` read seconds before the upload, with the same script the
            # build job's guard ran: the build job read it minutes ago, and
            # another release may have moved it since.
            - name: Publish (Trusted Publishing / OIDC)
              id: publish
              env:
                  PKG_NAME: ${{ needs.build.outputs.name }}
                  VERSION: ${{ needs.build.outputs.version }}
                  TARBALL: ${{ needs.build.outputs.tarball }}
                  BUILD_DIST_TAG: ${{ needs.build.outputs.dist_tag }}
              run: |
                  PUBLISHED=$(npm view --prefer-online "${PKG_NAME}@${VERSION}" version 2>/dev/null || true)
                  if [ "$PUBLISHED" = "$VERSION" ]; then
                    echo "· ${PKG_NAME}@${VERSION} is already on the registry — skipping publish"
                    echo "  (re-run path: the read-back and the GitHub Release below still run)"
                    exit 0
                  fi
                  CURRENT_LATEST=$(bash scripts/release-dist-tag.sh current-latest "$PKG_NAME" 2>"$RUNNER_TEMP/current-latest.err") || { cat "$RUNNER_TEMP/current-latest.err"; exit 1; }
                  cat "$RUNNER_TEMP/current-latest.err"
                  DIST_TAG=$(bash scripts/release-dist-tag.sh pick "$VERSION" "$CURRENT_LATEST" 2>"$RUNNER_TEMP/pick.err") || { cat "$RUNNER_TEMP/pick.err"; exit 1; }
                  if [ "$DIST_TAG" != "$BUILD_DIST_TAG" ]; then
                    echo "::notice::the registry's latest moved to '${CURRENT_LATEST}' since the build job; publishing under ${DIST_TAG}, not ${BUILD_DIST_TAG}"
                  fi
                  echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
                  npm publish "./${TARBALL}" --provenance --access public --tag "${DIST_TAG}"
                  echo "published=true" >> "$GITHUB_OUTPUT"

            # Registry read-back: npm must actually serve this version, and its
            # dist-tag (`latest`, `next` for a prerelease, `release-<maj>.<min>`
            # for a version not above the registry's latest) must point at it — a
            # publish that silently landed under another tag would otherwise look
            # like a green release. Both waits get the same 30-minute window: the
            # dist-tag lags the version by as much as the version lags the upload.
            #
            # The dist-tag wait runs only when this run uploaded: a skipped
            # publish set no tag, and the run that did upload already waited for
            # it. Tags are read from `dist-tags --json`, because `npm view` takes
            # `dist-tags.release-0.75` as a path and always answers empty.
            #
            # The window is minutes, not seconds. npm accepts the upload and then
            # processes it asynchronously, printing "Your package is being
            # processed and may take a few minutes to become available" — and this
            # tarball is ~5 MB across ~2700 files, which is the slow end of that.
            # v0.53.0 published fine and failed here after 50s; v0.54.0 published
            # fine and failed here after the 6 minutes that was meant to fix it.
            # v0.76.0 took 18 minutes to show up, eclipsing the 15 that followed.
            # Both skipped the GitHub Release step and left the three surfaces out
            # of sync — exactly the drift this read-back exists to prevent. Hence
            # 30 minutes, and hence the publish step above being skippable: a
            # window can always be too short, so the recovery has to work.
            #
            # `npm view` is asked to skip its cache, so a negative answer from the
            # first attempt is not replayed for the rest of the loop.
            - name: Verify the npm registry serves this version under its dist-tag
              env:
                  PKG_NAME: ${{ needs.build.outputs.name }}
                  VERSION: ${{ needs.build.outputs.version }}
                  DIST_TAG: ${{ steps.publish.outputs.dist_tag }}
                  PUBLISHED_NOW: ${{ steps.publish.outputs.published }}
              run: |
                  for attempt in $(seq 1 120); do
                    PUBLISHED=$(npm view --prefer-online "${PKG_NAME}@${VERSION}" version 2>/dev/null || true)
                    [ -n "$PUBLISHED" ] && break
                    echo "· registry has not caught up yet (attempt ${attempt}/120); retrying in 15s"
                    sleep 15
                  done
                  if [ "$PUBLISHED" != "$VERSION" ]; then
                    echo "::error::npm still does not serve ${PKG_NAME}@${VERSION} after 30 minutes (got '${PUBLISHED}'). The publish step above succeeded, so the fix is \"Re-run failed jobs\" once the version shows on https://www.npmjs.com/package/${PKG_NAME} — the publish step skips a version the registry already has, so the re-run only redoes the read-back and the GitHub Release. \`make releases-sync\` creates the Release without re-running anything."
                    exit 1
                  fi
                  if [ "$PUBLISHED_NOW" != "true" ]; then
                    echo "✓ npm: ${PKG_NAME}@${VERSION} was already published; its dist-tag is the one the publishing run set"
                    exit 0
                  fi
                  for attempt in $(seq 1 120); do
                    TAGGED=$(bash scripts/release-dist-tag.sh get "${PKG_NAME}" "${DIST_TAG}")
                    [ "$TAGGED" = "$VERSION" ] && break
                    echo "· dist-tag ${DIST_TAG} is still '${TAGGED}' (attempt ${attempt}/120); retrying in 15s"
                    sleep 15
                  done
                  if [ "$TAGGED" != "$VERSION" ]; then
                    echo "::error::npm dist-tag ${DIST_TAG} is '${TAGGED}' after 30 minutes, expected '${VERSION}'"
                    exit 1
                  fi
                  echo "✓ npm: ${PKG_NAME}@${VERSION} published and tagged ${DIST_TAG}"

    release:
        name: GitHub Release
        needs: [build, publish]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: "22"

            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: ${{ needs.build.outputs.artifact }}

            - name: Check the tarball and the dist-tag script are the ones the build job packed
              env:
                  TARBALL: ${{ needs.build.outputs.tarball }}
                  SHA256: ${{ needs.build.outputs.sha256 }}
                  RELEASE_SCRIPT_SHA256: ${{ needs.build.outputs.release_script_sha256 }}
              run: |
                  echo "${SHA256}  ${TARBALL}" | sha256sum --check
                  echo "${RELEASE_SCRIPT_SHA256}  scripts/release-dist-tag.sh" | sha256sum --check

            # Keeps GitHub in step with npm: every published version gets the
            # matching GitHub Release, with its CHANGELOG section as the notes and
            # the published tarball attached. Idempotent — re-running a tag edits
            # the existing Release instead of failing.
            #
            # "Latest" on GitHub follows the registry (#472): the Release is
            # created with --latest only when npm's `latest` is this version, and
            # with --latest=false otherwise (backport, `next`). It is read from
            # the registry, not from the dist-tag the publish picked, so a re-run
            # that creates the Release of an already-published latest still
            # marks it. An existing Release keeps its flag: `gh release edit` is
            # never given one.
            #
            # Three checks keep the Release on the published commit (#452): the
            # tag still resolves to this run's SHA, `--verify-tag` refuses to let
            # `gh` create a missing tag at the default branch's HEAD, and the
            # tarball is attached only when its sha512 is the `dist.integrity`
            # npm serves — so `--clobber` can only ever re-upload the same bytes.
            - name: Create or update the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  PKG_NAME: ${{ needs.build.outputs.name }}
                  TAG: ${{ needs.build.outputs.tag }}
                  VERSION: ${{ needs.build.outputs.version }}
                  PRERELEASE: ${{ needs.build.outputs.prerelease }}
                  TARBALL: ${{ needs.build.outputs.tarball }}
              run: |
                  TAG_COMMIT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)
                  if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
                    echo "::error::tag ${TAG} now points at ${TAG_COMMIT}, but ${GITHUB_SHA} is what was published"
                    exit 1
                  fi
                  INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
                  for attempt in $(seq 1 120); do
                    SERVED=$(npm view --prefer-online "${PKG_NAME}@${VERSION}" dist.integrity 2>/dev/null || true)
                    [ -n "$SERVED" ] && break
                    echo "· npm has not reported dist.integrity yet (attempt ${attempt}/120); retrying in 15s"
                    sleep 15
                  done
                  if [ -z "$SERVED" ]; then
                    echo "::error::npm did not report dist.integrity for ${PKG_NAME}@${VERSION} after 30 minutes; nothing was attached. Re-run this job once https://www.npmjs.com/package/${PKG_NAME}/v/${VERSION} shows the version."
                    exit 1
                  fi
                  if [ "$INTEGRITY" != "$SERVED" ]; then
                    echo "::error::${TARBALL} (${INTEGRITY}) is not the tarball npm serves for ${PKG_NAME}@${VERSION} (${SERVED}): this attempt rebuilt it, and the pack is not byte-identical to the published one. Nothing was attached. Create the Release from the tag with \`make releases-sync\` (no asset), or attach the registry's own tarball (\`npm pack ${PKG_NAME}@${VERSION}\`) by hand."
                    exit 1
                  fi
                  node scripts/changelog.mjs notes "$VERSION" --allow-unreleased > /tmp/release-notes.md
                  {
                    echo ""
                    echo "---"
                    echo ""
                    echo "📦 npm: [\`tempest-react-sdk@${VERSION}\`](https://www.npmjs.com/package/tempest-react-sdk/v/${VERSION}) — publicado com provenance (OIDC)."
                  } >> /tmp/release-notes.md
                  FLAGS=(--title "$TAG" --notes-file /tmp/release-notes.md)
                  [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release edit "$TAG" "${FLAGS[@]}"
                    gh release upload "$TAG" "$TARBALL" --clobber
                  else
                    REGISTRY_LATEST=$(scripts/release-dist-tag.sh current-latest "$PKG_NAME" 2>"$RUNNER_TEMP/current-latest.err") || { cat "$RUNNER_TEMP/current-latest.err"; exit 1; }
                    if [ "$REGISTRY_LATEST" = "$VERSION" ]; then
                      LATEST_FLAG=--latest
                    else
                      LATEST_FLAG=--latest=false
                    fi
                    gh release create "$TAG" "$TARBALL" --verify-tag "$LATEST_FLAG" "${FLAGS[@]}"
                  fi
                  echo "✓ GitHub Release ${TAG} em sincronia com npm ${VERSION}"
