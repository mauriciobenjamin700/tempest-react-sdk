site_name: tempest-react-sdk
site_description: Blocos React/TypeScript compartilhados da Tempest — componentes, hooks, HTTP, auth, query, forms, tempo real, tema, i18n, telemetria, feature flags e offline.
site_url: https://mauriciobenjamin700.github.io/tempest-react-sdk/
repo_url: https://github.com/mauriciobenjamin700/tempest-react-sdk
repo_name: mauriciobenjamin700/tempest-react-sdk
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Mauricio Benjamin — MIT License
docs_dir: docs

theme:
    name: material
    language: pt-BR
    palette:
        - media: "(prefers-color-scheme)"
          toggle:
              icon: material/brightness-auto
              name: Usar tema claro
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-7
              name: Usar tema escuro
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/brightness-4
              name: Seguir preferência do sistema
    features:
        - announce.dismiss
        - content.action.edit
        - content.action.view
        - content.code.annotate
        - content.code.copy
        - content.tabs.link
        - content.tooltips
        - navigation.footer
        - navigation.indexes
        - navigation.path
        - navigation.sections
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.top
        - navigation.tracking
        - search.highlight
        - search.share
        - search.suggest
        - toc.follow
    icon:
        repo: fontawesome/brands/github
        edit: material/pencil
        view: material/eye

plugins:
    - search
    - i18n:
          docs_structure: suffix
          fallback_to_default: true
          reconfigure_material: true
          reconfigure_search: true
          languages:
              - { locale: pt, name: "Português (BR)", default: true, build: true }
              - locale: en
                name: English (US)
                build: true
                nav_translations:
