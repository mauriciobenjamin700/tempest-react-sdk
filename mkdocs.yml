markdown_extensions:
    - admonition
    - attr_list
    - def_list
    - tables
    - pymdownx.details
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.highlight
    - pymdownx.inlinehilite
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.emoji

validation:
    nav: { omitted_files: ignore }
    links: { absolute_links: ignore }

extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/mauriciobenjamin700/tempest-react-sdk
        - icon: fontawesome/brands/npm
          link: https://www.npmjs.com/package/tempest-react-sdk

